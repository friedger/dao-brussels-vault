[project]
name = "dao-brussels-vault"
description = ""
authors = []
telemetry = true
cache_dir = "./.cache"
requirements = [
    {contract_id = "SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token"},
    # v2: sBTC balances on simnet, and the two live sBTC pools
    {contract_id = "SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-deposit"},
    {contract_id = "SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-withdrawal"},
    {contract_id = "SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG.stacking-dao-core-stbtc-v1"},
    {contract_id = "SP8HK160YD5GHXP69VGA0TC7AQJ1X4CDW3XVERSE.sbtc-bond-staker-v1-3"}
]

# Clarinet's bundled pox-5 differs from the canonical one the pools and signer
# managers are written against (same file as ../../fastpool/fastpool-pox-5).
[project.override_boot_contracts_source]
pox-5 = "./boot/pox-5.clar"

# bxl-tokens are unchanged

[contracts.bxl-btc-v2]
path = "contracts/bxl-btc.clar"
clarity = "6"
epoch = "4.0"

[contracts.bxl-stx-v2]
path = "contracts/bxl-stx.clar"
clarity = "6"
epoch = "4.0"

