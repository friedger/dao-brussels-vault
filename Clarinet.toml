[project]
name = "dao-brussels-vault"
description = ""
authors = []
telemetry = true
cache_dir = "./.cache"
requirements = [
    {contract_id = "SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token"},
    # v2: sBTC balances on simnet, and the two live sBTC pools
    {contract_id = "SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-deposit"},
    {contract_id = "SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-withdrawal"},
    {contract_id = "SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG.stacking-dao-core-stbtc-v1"},
    {contract_id = "SP8HK160YD5GHXP69VGA0TC7AQJ1X4CDW3XVERSE.sbtc-bond-staker-v1-3"},
    # Fast Pool's max500 signer manager, which `bxl-pool-bond` stakes with.
    {contract_id = "SPMPMA1V6P430M8C91QS1G9XJ95S59JS1TZFZ4Q4.fastpool-max500-signer-manager"}
]

# Clarinet's bundled pox-5 differs from the canonical one the pools and signer
# managers are written against (same file as ../../fastpool/fastpool-pox-5).
[project.override_boot_contracts_source]
pox-5 = "./boot/pox-5.clar"

# bxl-tokens are unchanged

[contracts.bxl-btc-v2]
path = "contracts/bxl-btc.clar"
clarity = "6"
epoch = "4.0"

[contracts.bxl-stx-v2]
path = "contracts/bxl-stx.clar"
clarity = "6"
epoch = "4.0"

## v2 (pox-5)

[contracts.sbtc-pool-trait]
path = "contracts/sbtc-pool-trait.clar"
clarity_version = 6
epoch = "4.0"

[contracts.bxl-vault-v2]
path = "contracts/bxl-vault-v2.clar"
clarity_version = 6
epoch = "4.0"

[contracts.bxl-pool-stbtc]
path = "contracts/bxl-pool-stbtc.clar"
clarity_version = 6
epoch = "4.0"

[contracts.bxl-pool-xverse]
path = "contracts/bxl-pool-xverse.clar"
clarity_version = 6
epoch = "4.0"

[contracts.bxl-pool-bond]
path = "contracts/bxl-pool-bond.clar"
clarity_version = 6
epoch = "4.0"

## Tests
# A registered pox-5 signer for staking tests (Fast Pool's manager).
[contracts.signer-manager]
path = "../../fastpool/fastpool-pox-5/contracts/signer-manager.clar"
clarity_version = 6
epoch = "4.0"

[contracts.mock-sbtc-pool]
path = "tests/mocks/mock-sbtc-pool.clar"
clarity_version = 6
epoch = "4.0"

# Rendezvous target: forwards to the vault and the mock pool, holds the
# invariants (npm run fuzz:invariant).
[contracts.bxl-vault-v2-rv]
path = "rendezvous/bxl-vault-v2-rv.clar"
clarity_version = 6
epoch = "4.0"

[linter]
include = ["contracts/*.clar"]
exclude = []

